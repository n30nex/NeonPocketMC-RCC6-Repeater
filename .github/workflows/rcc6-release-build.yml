name: RCC6 MQTT Repeater Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up PlatformIO
        uses: ./.github/actions/setup-build-environment

      - name: Run upstream host tests
        run: pio test -e native

  build-rcc6:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up PlatformIO
        uses: ./.github/actions/setup-build-environment

      - name: Verify RCC6 defaults and broker parity
        run: |
          python scripts/configure_rcc6.py --self-test
          python - <<'PY'
          import re
          from pathlib import Path

          presets = Path("src/helpers/MQTTPresets.h").read_text(encoding="utf-8")
          body = presets.split("static const MQTTPresetDef MQTT_PRESETS", 1)[1]
          names = re.findall(r'^\s*\{\s*"([^"]+)"', body, re.M)
          assert len(names) == 34, names
          assert len(set(names)) == 34, names
          assert "meshcore-ca-1" in names and "meshcore-ca-2" in names

          config = Path("variants/heltec_rcc6/platformio.ini").read_text(encoding="utf-8")
          assert 'MQTT_DEFAULT_SLOT1_PRESET=\'"meshcore-ca-1"\'' in config
          assert 'MQTT_DEFAULT_SLOT2_PRESET=\'"meshcore-ca-2"\'' in config
          assert 'DEFAULT_PATH_HASH_MODE=2' in config
          assert 'WEBCONFIG_AUTO_LAN=1' in config

          readme = Path("README.md").read_text(encoding="utf-8")
          assert "3-byte advert" in readme
          assert "Configure-RCC6-Windows.cmd" in readme
          assert "get wifi.status" in readme
          assert "SETUP_AND_HELP.md" in readme
          PY

      - name: Build the headless RCC6 observer
        run: |
          pio run -e heltec_rcc6_repeater_observer_mqtt
          pio run -e heltec_rcc6_repeater_observer_mqtt -t mergebin

      - name: Verify binary layout and package Ultimate RC1
        run: |
          python - <<'PY'
          import hashlib
          import zipfile
          from pathlib import Path

          build = Path(".pio/build/heltec_rcc6_repeater_observer_mqtt")
          app = (build / "firmware.bin").read_bytes()
          merged = (build / "firmware-merged.bin").read_bytes()

          assert app[0] == 0xE9, "invalid ESP app image"
          assert app[2] == 0x02, "RCC6 app is not DIO"
          assert merged[0x10000:0x10000 + len(app)] == app, "merged app mismatch"
          assert len(merged) < 0xC90000, "recovery image reaches the SPIFFS data partition"

          out = Path("release")
          out.mkdir()
          app_name = "NeonPocketMC-RCC6-Ultimate-Observer-v1.3.0-rc.4-app.bin"
          recovery_name = "NeonPocketMC-RCC6-Ultimate-Observer-v1.3.0-rc.4-full-recovery-preserves-meshcore-settings.bin"
          configurator_name = "NeonPocketMC-RCC6-Ultimate-Server-v1.3.0-rc.4-configurator.zip"
          (out / app_name).write_bytes(app)
          (out / recovery_name).write_bytes(merged)

          quick_start = (
              "NeonPocketMC RCC6 Ultimate Observer Setup\n"
              "=================================\n\n"
              "1. Keep USB and a tuned LoRa antenna connected.\n"
              "2. Flash the application image at 0x10000. Do not erase flash.\n"
              "3. Windows: double-click Configure-RCC6-Windows.cmd\n"
              "4. Linux: run sh configure-rcc6-linux.sh\n"
              "5. Follow the numbered questions. Do not disconnect until the wizard says it is safe.\n\n"
              "OPEN THE DASHBOARD\n"
              "- The wizard prints the exact http://DEVICE-IP/ address.\n"
              "- Later, use a 115200-baud USB terminal and run: get wifi.status\n"
              "- Use http://, not https://, from a device on the same local network.\n"
              "- Sign in with the admin password chosen during setup.\n"
              "- A new/unconfigured unit provides MeshCore-Setup-XXXX at http://192.168.4.1/\n\n"
              "RECOVERY\n"
              "- If Wi-Fi says disconnected, keep USB attached and rerun the configurator.\n"
              "- The RCC6 requires a local 2.4 GHz Wi-Fi network.\n"
              "- Router DHCP can change the IP; reserve it in the router if needed.\n"
              "- Read SETUP_AND_HELP.md for radio, MQTT, broker, flashing, and troubleshooting help.\n"
          )
          setup_help = Path("README.md").read_text(encoding="utf-8")
          build_info = (
              "Git commit: ${{ github.event.pull_request.head.sha || github.sha }}\n"
              "Target: heltec_rcc6_repeater_observer_mqtt\n"
              "MeshCore target baseline: official v1.17.1\n"
              "Observer base: agessaman/MeshCore b744b42a plus reviewed stability fixes through 8d1a0eb3\n"
          )
          (out / "QUICK_START.txt").write_text(quick_start, encoding="utf-8")
          (out / "SETUP_AND_HELP.md").write_text(setup_help, encoding="utf-8")
          (out / "BUILD_INFO.txt").write_text(build_info, encoding="utf-8")
          with zipfile.ZipFile(out / configurator_name, "w", zipfile.ZIP_DEFLATED) as archive:
              archive.write("Configure-RCC6-Windows.cmd", "Configure-RCC6-Windows.cmd")
              archive.write("configure-rcc6-linux.sh", "configure-rcc6-linux.sh")
              archive.write("scripts/configure_rcc6.py", "scripts/configure_rcc6.py")
              archive.writestr("QUICK_START.txt", quick_start)
              archive.writestr("SETUP_AND_HELP.md", setup_help)
              archive.writestr("BUILD_INFO.txt", build_info)

          with zipfile.ZipFile(out / configurator_name) as archive:
              required = {
                  "Configure-RCC6-Windows.cmd", "configure-rcc6-linux.sh",
                  "scripts/configure_rcc6.py", "QUICK_START.txt",
                  "SETUP_AND_HELP.md", "BUILD_INFO.txt",
              }
              assert required <= set(archive.namelist()), "incomplete configurator package"

          files = [out / app_name, out / recovery_name, out / configurator_name]
          sums = "".join(
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n"
              for path in files
          )
          (out / "SHA256SUMS.txt").write_text(sums, encoding="ascii")
          PY

      - name: Upload exact Ultimate candidate
        uses: actions/upload-artifact@v4
        with:
          name: NeonPocketMC-RCC6-Repeater-${{ github.event.pull_request.head.sha || github.sha }}
          path: release/
          if-no-files-found: error

  required-repeater:
    name: required-repeater
    if: ${{ always() }}
    needs: [unit-tests, build-rcc6]
    runs-on: ubuntu-latest
    steps:
      - name: Require tests and repeater firmware
        env:
          TEST_RESULT: ${{ needs.unit-tests.result }}
          BUILD_RESULT: ${{ needs.build-rcc6.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$BUILD_RESULT" = success
