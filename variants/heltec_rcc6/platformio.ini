[heltec_rcc6]
extends = esp32c6_base
board = heltec_rcc6
board_build.partitions = default_16MB.csv
board_build.flash_mode = dio
upload_protocol = esptool
build_flags =
  ${esp32c6_base.build_flags}
  -I variants/heltec_rcc6
  -D HELTEC_RCC6=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D P_LORA_SCLK=21
  -D P_LORA_MISO=20
  -D P_LORA_MOSI=22
  -D P_LORA_NSS=23
  -D P_LORA_DIO_1=19
  -D P_LORA_BUSY=10
  -D P_LORA_RESET=8
  -D PIN_USER_BTN=9
  -D PIN_BOARD_SDA=-1
  -D PIN_BOARD_SCL=-1
  -D PIN_ADC_CTRL=5
  -D ADC_CTRL_ENABLED=HIGH
  -D PIN_VBAT_READ=6
  -D ADC_MULTIPLIER=4.95f
  -D PIN_TFT_CS=18
  -D PIN_TFT_EN=2
  -D PIN_TFT_BL=1
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D DISABLE_WIFI_OTA=1
build_src_filter = ${esp32c6_base.build_src_filter}
  +<../variants/heltec_rcc6>
lib_deps =
  ${esp32c6_base.lib_deps}

[env:heltec_rcc6_repeater_observer_mqtt]
extends = heltec_rcc6
extra_scripts =
  ${esp32_base.extra_scripts}
  pre:scripts/generate_cert_bundle.py
board_ssl_cert_source = adafruit
board_build.embed_files = src/certs/x509_crt_bundle.bin
build_flags =
  ${heltec_rcc6.build_flags}
  -D NEONPOCKET_RCC6_REPEATER=1
  -D FIRMWARE_VERSION='"v1.17.0-rcc6-mqtt-rc2"'
  -D ADVERT_NAME='"RCC6 MQTT Observer"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_MQTT_BRIDGE=1
  -D MQTT_NEIGHBORS_WITHOUT_PSRAM=1
  -D MQTT_MAX_PACKET_SIZE=1024
  -D CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
  -D ESP32_CPU_FREQ=160
  -D MQTT_WIFI_TX_POWER=WIFI_POWER_11dBm
  -D DEFAULT_PATH_HASH_MODE=2
  -D WEBCONFIG_AUTO_LAN=1
  -D MQTT_DEFAULT_SLOT1_PRESET='"meshcore-ca-1"'
  -D MQTT_DEFAULT_SLOT2_PRESET='"meshcore-ca-2"'
build_src_filter = ${heltec_rcc6.build_src_filter}
  +<helpers/bridges/MQTTBridge.cpp>
  +<helpers/MQTTMessageBuilder.cpp>
  +<helpers/JWTHelper.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${heltec_rcc6.lib_deps}
  ${esp32_ota.lib_deps}
  elims/PsychicMqttClient@^0.2.4
  bblanchon/ArduinoJson @ 7.4.3
  arduino-libraries/NTPClient
  JChristensen/Timezone
  paulstoffregen/Time@1.6.1

; RCC6 room-server release profiles. Keep the common room core separate from
; the optional TFT and full network stack so the selected feature set is
; explicit in both the environment name and the resulting binary.
[heltec_rcc6_room_server_common]
extends = heltec_rcc6
build_flags =
  ${heltec_rcc6.build_flags}
  -D NEONPOCKET_RCC6_ROOM_SERVER=1
  -D NEONPOCKET_SAFE_SPIFFS_BOOTSTRAP=1
  -D FIRMWARE_VERSION='"v1.17.0-rcc6-room-rc1"'
  -D ADVERT_NAME='"RCC6 Room Server"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
  -D DEFAULT_PATH_HASH_MODE=2
  -D ESP32_CPU_FREQ=160
build_src_filter = ${heltec_rcc6.build_src_filter}
  +<../examples/simple_room_server>
lib_deps =
  ${heltec_rcc6.lib_deps}

[heltec_rcc6_room_server_tft_features]
build_flags =
  -D HELTEC_RCC6_WITH_DISPLAY=1
  -D DISPLAY_CLASS=NV3001BDisplay
  -D DISPLAY_REQUIRED=1
  -D NV3001B_USE_SOFTWARE_SPI=1
  -D NV3001B_USE_FAST_GPIO=1
  -D NV3001B_USE_FRAMEBUFFER=1
  -D NV3001B_LOGICAL_WIDTH=220
  -D NV3001B_LOGICAL_HEIGHT=128
  -D NV3001B_SCREEN_WIDTH=220
  -D NV3001B_SCREEN_HEIGHT=128
  -D PIN_TFT_SCL=4
  -D PIN_TFT_SDA=15
  -D PIN_TFT_CS=18
  -D PIN_TFT_DC=3
  -D PIN_TFT_RST=0
  -D PIN_TFT_EN=2
  -D PIN_TFT_EN_ACTIVE=LOW
  -D PIN_TFT_BL=1
  -D PIN_TFT_BL_ACTIVE=HIGH
  -D DISPLAY_ROTATION=0
  -D AUTO_OFF_MILLIS=60000
build_src_filter =
  +<helpers/ui/NV3001BDisplay.cpp>

[heltec_rcc6_room_server_full]
extends = heltec_rcc6_room_server_common
extra_scripts =
  ${esp32_base.extra_scripts}
  pre:scripts/generate_cert_bundle.py
board_ssl_cert_source = adafruit
board_build.embed_files = src/certs/x509_crt_bundle.bin
build_flags =
  ${heltec_rcc6_room_server_common.build_flags}
  -D NEONPOCKET_ROOM_SERVER_FULL=1
  -D WITH_MQTT_BRIDGE=1
  -D MQTT_MAX_PACKET_SIZE=1024
  -D CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
  -D MQTT_WIFI_TX_POWER=WIFI_POWER_11dBm
  -D WEBCONFIG_AUTO_LAN=1
  -D MQTT_DEFAULT_SLOT1_PRESET='"meshcore-ca-1"'
  -D MQTT_DEFAULT_SLOT2_PRESET='"meshcore-ca-2"'
build_src_filter = ${heltec_rcc6_room_server_common.build_src_filter}
  +<helpers/bridges/MQTTBridge.cpp>
  +<helpers/MQTTMessageBuilder.cpp>
  +<helpers/JWTHelper.cpp>
lib_deps =
  ${heltec_rcc6_room_server_common.lib_deps}
  ${esp32_ota.lib_deps}
  elims/PsychicMqttClient@^0.2.4
  bblanchon/ArduinoJson @ 7.4.3
  arduino-libraries/NTPClient
  JChristensen/Timezone
  paulstoffregen/Time@1.6.1

[env:heltec_rcc6_room_server_minimal_headless]
extends = heltec_rcc6_room_server_common
build_flags =
  ${heltec_rcc6_room_server_common.build_flags}
  -D NEONPOCKET_ROOM_SERVER_PROFILE='"minimal-headless"'

[env:heltec_rcc6_room_server_minimal_tft]
extends = heltec_rcc6_room_server_common
build_flags =
  ${heltec_rcc6_room_server_common.build_flags}
  ${heltec_rcc6_room_server_tft_features.build_flags}
  -D NEONPOCKET_ROOM_SERVER_PROFILE='"minimal-tft"'
build_src_filter = ${heltec_rcc6_room_server_common.build_src_filter}
  ${heltec_rcc6_room_server_tft_features.build_src_filter}

[env:heltec_rcc6_room_server_full_headless]
extends = heltec_rcc6_room_server_full
build_flags =
  ${heltec_rcc6_room_server_full.build_flags}
  -D NEONPOCKET_ROOM_SERVER_PROFILE='"full-headless"'

[env:heltec_rcc6_room_server_full_tft]
extends = heltec_rcc6_room_server_full
build_flags =
  ${heltec_rcc6_room_server_full.build_flags}
  ${heltec_rcc6_room_server_tft_features.build_flags}
  -D NEONPOCKET_ROOM_SERVER_PROFILE='"full-tft-experimental"'
  -D NEONPOCKET_ROOM_SERVER_EXPERIMENTAL=1
  -D NEONPOCKET_HEAP_DIAGNOSTICS=1
  -D NEONPOCKET_MEMORY_GATE_BYTES=32768
build_src_filter = ${heltec_rcc6_room_server_full.build_src_filter}
  ${heltec_rcc6_room_server_tft_features.build_src_filter}
